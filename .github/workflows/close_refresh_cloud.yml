name: 收盘刷新（云端）

# ⑤ 自动更新迁移云端 · Phase 1（只写 gh-pages，不写 main）
# ---------------------------------------------------------------------------
# 触发：
#   schedule        周一~五 07:05 UTC = 北京 15:05（与本地链同步启动）
#   workflow_dispatch  mode=probe（默认，只验云端管道，不跑链）
#                      mode=chain（跑云端子集全链，需数据缓存/种子就位）
# 数据：data_full/ data_hist/ fund_nav_cache/ data_fundamental/ 均被 .gitignore 排除，
#       故用 actions/cache（key 带 run_id，仓库 10GB 上限按 LRU 自淘汰）
#       + 每周日把四个目录各自打包上传 release `data-seed` 兜底
#       （分目录打包：单资产 2GB 上限，合计约 4.5GB 原始体积不可单包）
# 发布：cloud_refresh.py 组装 _cloud_dist/ 并过三道门禁，publish=true 才 peaceiris 写 gh-pages
#       keep_files:true → 盘中 rt_snapshot.yml 产出的文件不会被本 workflow 删除
# 退出码：0 成功（含 no-new-data）/ 1 链失败 / 2 门禁拒发 / 3 数据未就位（本 workflow 视为告警不红）
# 2026-09-30 加「链失败门禁」末步：链 rc≠0（daily_refresh 的 fails 非空）时，在发布/回读/delta
#   全部照常完成之后把 job 置红。修此前「链 rc=1 但 cloud_refresh 因 publish=true 仍 return 0
#   ⇒ job 绿、摘要 rc=0」的静默吞错（run 36722593102 的 build_dual_system exit 1 即此例）。
# 2026-10-03 加 as_of 输入 + G2b 门禁（R-cloud-makeup-1003）：修「看板停在 09-29 且无法自愈」。
#   两处独立缺陷：①09-30 链内 build_dual_system 崩溃 → dual_system.html 未重建，而两个 JS
#   已刷到 09-30；旧 G2 只看 JS 故放行，上线「标题 09-29 / 数据 09-30」的错配看板。
#   ②G2 按「北京今日」判新鲜 → 长假期间恒 no-new-data，10-01 已重建出 09-30 全套却被丢掉，
#   只能干等下一个真实交易日直接从 09-29 跳到 10-08/10-09。修法：G2a 三锚点（含 HTML）+
#   可显式断言数据日的 as_of 输入；G2b 用 mtime 判定「这版看板到底重建没重建」。
# 2026-10-03 共享交易日历加固（R-index-cache-1003）：index_000300.csv 是全站交易日历（build_dual_system
#   顶部「tradeDay = 该文件末行」）。补线修好后仍有复发路径：链内补出的行不入缓存、也不回写 main
#   （云端 --no-main-push），且三源全被拒时补线整体跳过。
#   落地①（**保留**）：把补出的 2026-09-29 / 2026-09-30 两行入库 —— 零网络时也有正确锚点。
#   落地②（**已回退**）：曾把 index_000300.csv 加进本文件两处 actions/cache 的 path。实测
#     run 37125519172：`Cache not found for input keys: qws-data-37125519172, qws-data-` —— path
#     列表属于**缓存版本哈希**，一改即让全部历史缓存失配 → 回落周日种子（数据只到 09-27）→
#     update_daily 拒拉、universe_cal exit 2、链 rc=1。代价（丢掉增量数据缓存）远大于收益，故回退。
# 2026-09-25 改名为 close_refresh_cloud.yml（R-cloudsync-0925）：cron 曾于 09-24 改为 07:05 UTC，
#   但 GitHub 旧注册未刷新——09-24 12:40 / 09-25 12:42 UTC 两轮仍按旧 12:30 UTC 触发（延迟 10–12 分钟特征一致）。
#   同路径改文件不生效 → 改名 = 新建 workflow 实体，强制重新注册 schedule。（旧名 close_refresh.yml 已废弃）
on:
  schedule:
    - cron: '5 7 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe=只验管道（不跑链）；chain=跑云端子集全链'
        type: choice
        options:
          - probe
          - chain
        default: probe
      force:
        # 2026-09-27 加（R-cloud-force-0927）：仅手工触发生效，定时任务不受影响。
        # 不加它则周末/非交易日永远测不到链 —— 09-27 周日实测：chain 模式打印
        # 「[skip] 周末 —— 收盘刷新无需执行」后 rc=0 空转，新策略步骤根本没被执行。
        description: 'chain 是否加 --force（越过周末/非交易日守卫；仅验证/补跑用）'
        type: choice
        options:
          - '0'
          - '1'
        default: '0'
      as_of:
        # 2026-10-03 加（R-cloud-makeup-1003）：补发/补跑必须显式断言数据日。
        # 背景：cloud_refresh.py 的 G2 原先按「北京今日」判新鲜 → 非交易日/长假恒判
        #   no-new-data（绿、不发布），于是 09-30 那次 build_dual_system 崩溃造成的
        #   旧看板再也无法被纠正。留空 = 沿用今日（定时任务原语义，行为不变）。
        description: '期望数据日 YYYY-MM-DD（补发/补跑用；留空=今日）。与实物不符即 rc2 拒发'
        type: string
        default: ''

concurrency:
  group: close-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 2026-09-29：150 → 180min。链预算同步抬到 9000s(150min)；后段门禁/组装/发布实测仅 ~37s，
    #   留 30min 余量足够。（run 36558370018 实测：7200s 墙在 fetch_val_daily 前砍断全链）
    timeout-minutes: 180
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---- 0 判定模式：schedule 恒为 chain，手工触发用输入值 ----
      - name: 判定模式
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then M=chain; else M="${{ inputs.mode }}"; fi
          [ -z "$M" ] && M=probe
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "云模式：$M（触发：${{ github.event_name }}）"

      # ---- 1 数据缓存（**完全**未命中才回落种子 release；restore-keys 部分命中不回落）----
      - name: 恢复数据缓存
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data_full
            data_hist
            fund_nav_cache
            data_fundamental
            backtest/a5_experiment
          key: qws-data-${{ github.run_id }}
          restore-keys: |
            qws-data-

      - name: 回落种子包（无任何缓存命中时）
        # F6 修复（2026-09-24）：cache-hit 在 restore-keys 部分命中时为 false，
        # 旧条件会用周种子覆盖刚恢复的较新缓存；cache-matched-key 为空才表示真的没有缓存。
        if: steps.cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/seed"
          if gh release download data-seed -p 'qws_seed_*.tar.gz' -D "$RUNNER_TEMP/seed" --clobber; then
            for f in "$RUNNER_TEMP/seed"/qws_seed_*.tar.gz; do
              echo "解包 $(basename "$f")"
              tar -xzf "$f" -C . --skip-old-files || echo "::warning::$(basename "$f") 解包时跳过已存在文件（非 0 退出已忽略）"
            done
          else
            echo "::warning::种子包尚未就位（release data-seed 缺失）—— chain 模式将 rc=3 no-data-cache"
          fi

      - name: 安装依赖（chain 模式）
        if: steps.mode.outputs.mode == 'chain'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/cloud/requirements.txt

      # ---- 2 组装 + 门禁（必要时先跑链）----
      - name: 云端刷新（组装/门禁/可选跑链）
        id: refresh
        run: |
          set +e
          FORCE_ARG=""
          if [ "${{ inputs.force }}" = "1" ]; then FORCE_ARG="--force-chain"; fi
          EXPECT_ARG=""
          if [ -n "${{ inputs.as_of }}" ]; then EXPECT_ARG="--expect-as-of ${{ inputs.as_of }}"; fi
          echo "force 输入='${{ inputs.force }}' → 链参数 \"$FORCE_ARG\" · 期望数据日='${{ inputs.as_of }}' → \"$EXPECT_ARG\""
          python -X utf8 .github/cloud/cloud_refresh.py --mode ${{ steps.mode.outputs.mode }} $FORCE_ARG $EXPECT_ARG
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "退出码 rc=$rc（0 成功｜1 链失败｜2 门禁拒发｜3 数据未就位）"
          if [ "$rc" = "0" ]; then exit 0; fi
          if [ "$rc" = "3" ]; then
            echo "::warning::云端数据未就位（no-data-cache / 端点不可用），本次不发布"
            exit 0
          fi
          exit $rc

      # ---- 3 发布 gh-pages（仅门禁全过）----
      - name: 发布 gh-pages
        if: steps.refresh.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_cloud_dist
          publish_branch: gh-pages
          keep_files: true
          commit_message: "chore(cloud): ${{ steps.mode.outputs.mode }} 收盘刷新 ${{ github.run_id }}"

      # ---- 4 线上回读（验收；CDN ~10min，读旧属正常）----
      - name: 线上回读
        if: steps.refresh.outputs.publish == 'true'
        run: |
          CB=$(date +%s)
          BASE="https://hawchou1995.github.io/quant-weight-system"
          echo "--- 线上 _cloud_manifest.json（cache-bust）---"
          curl -fsS "$BASE/_cloud_manifest.json?cb=$CB" | head -c 800 || echo "（尚未传播，CDN 缓存约 10 分钟）"
          echo
          echo "--- 线上 index.html 首 3 行 ---"
          curl -fsS "$BASE/index.html?cb=$CB" | head -3 || true

      # ---- 5 回写数据缓存（chain 模式，供次日增量）----
      - name: 保存数据缓存
        if: always() && steps.mode.outputs.mode == 'chain'
        uses: actions/cache/save@v4
        with:
          path: |
            data_full
            data_hist
            fund_nav_cache
            data_fundamental
            backtest/a5_experiment
          key: qws-data-${{ github.run_id }}

      # ---- 5b 当日数据 delta（供本机同步 K 线；链失败也产出，故用 always）----
      - name: 当日数据 delta
        if: always() && steps.mode.outputs.mode == 'chain'
        run: python -X utf8 backtest/build_data_delta.py --out _cloud_delta

      - name: 上传数据 delta
        if: always() && steps.mode.outputs.mode == 'chain'
        uses: actions/upload-artifact@v4
        with:
          name: data-delta
          path: _cloud_delta/
          retention-days: 45
          if-no-files-found: warn

      # ---- 6 每周日种子备份（仅 chain 且周日）----
      - name: 每周种子备份
        if: always() && steps.mode.outputs.mode == 'chain'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u)" != "7" ]; then echo "非周日，跳过种子备份"; exit 0; fi
          cd "$GITHUB_WORKSPACE"
          for d in data_full data_hist fund_nav_cache data_fundamental; do
            [ -d "$d" ] || continue
            echo "打包 $d ..."
            tar -czf "$RUNNER_TEMP/qws_seed_$d.tar.gz" "$d"
            ls -lh "$RUNNER_TEMP/qws_seed_$d.tar.gz"
          done
          gh release view data-seed >/dev/null 2>&1 \
            || gh release create data-seed --title "量化数据种子" --notes "云端收盘刷新数据种子（每周日全量更新）"
          gh release upload data-seed "$RUNNER_TEMP"/qws_seed_*.tar.gz --clobber

      # ---- 7 摘要 ----
      - name: 摘要
        if: always()
        run: |
          echo "mode=${{ steps.mode.outputs.mode }} status=${{ steps.refresh.outputs.status }} publish=${{ steps.refresh.outputs.publish }} rc=${{ steps.refresh.outputs.rc }} chain_rc=${{ steps.refresh.outputs.chain_rc }}"
          [ -f _cloud_dist/_cloud_manifest.json ] && cat _cloud_dist/_cloud_manifest.json || true

      # ---- 8 链失败门禁（2026-09-30 加）----
      # 判据：链 rc≠0 ⇒ daily_refresh.py 的 fails 列表非空（硬失败；软失败 soft_fails 不改 rc）。
      # 此前 cloud_refresh.py 只要 publish=true 就 return 0，掩盖了链内硬失败。
      # 必须放最后且 always()：发布 / 回读 / 数据缓存 / data-delta 得先照常产出当日产物，
      #   本步只负责把 job 标红，让硬失败可见（回读仍成功，不丢产物）。
      - name: 链失败门禁
        if: always()
        run: |
          RC="${{ steps.refresh.outputs.chain_rc }}"
          echo "链返回码 chain_rc='${RC}'"
          # 空 = 非 chain 模式（无链）；"0" = 链全绿；
          # "3" = 外部端点不可用/数据未就位 —— 沿用 workflow 既有约定：告警不红；
          # 其余（典型 "1"）= daily_refresh.py 的 fails 非空 = 链内硬失败 → 置 job 红。
          if [ -z "$RC" ] || [ "$RC" = "0" ] || [ "$RC" = "3" ]; then
            echo "✅ 无链硬失败（chain_rc 为空/0/3）"
            exit 0
          fi
          echo "::error::链返回码 chain_rc=${RC} —— 链内存在硬失败（日志搜 '[chain] rc=' 与行首 '❌ 失败:'）。发布与 data-delta 已完成，本步仅置 job 失败以暴露问题。"
          exit 1
