name: probe-rt
# GitHub Actions 实时化可行性探针（2026-08-28）
# 链路：qt 行情 HTTP / 腾讯 K 线 HTTP / akshare(新浪+腾讯) / schedule / gh-pages 部署
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1-5'   # 生产档：周一~五 07:30 UTC = 北京 15:30（2026-09-28 起）
# 2026-09-28 用户批准：探针期 15 分钟档（*/15 * * * *）关闭，改回生产档，省 Actions 分钟。
#   ⚠ 同路径改 cron **可能不被 GitHub 重新注册**（close_refresh 于 09-24 实测过：改文件后仍按旧
#   cron 触发，最后靠**改名新建实体**才生效，见 close_refresh_cloud.yml 头部注释）。
#   若本文件改后仍以 15 分钟频率触发（或彻底不触发），处置：把本文件改名为 probe_rt_v2.yml
#   新建实体强制重注册；改名后需同步验收任务提示词里对 `probe_rt.yml` 的引用（步骤 1b）。

permissions:
  contents: write   # gh-pages push 需要（默认 read，probe 首跑 403 修复）

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -q akshare requests pandas

      - name: Run probe
        run: python .github/probe/probe.py

      - name: Deploy probe page (gh-pages-probe branch, 不动正式 gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .github/probe/out
          publish_branch: gh-pages-probe
          keep_files: true
